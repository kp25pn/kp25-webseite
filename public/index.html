<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Die Klassen-Webseite der KP25 an der Euro Akademie Pößneck. Gemeinsam auf dem Weg zum Abschluss 2028." />
  <meta name="theme-color" content="#164aa3" />
  <meta property="og:title" content="KP25 | Kinderpfleger*in in Pößneck" />
  <meta property="og:description" content="Gemeinsam auf dem Weg zum Abschluss 2028." />
  <meta property="og:type" content="website" />
  <title>KP25 | Kinderpfleger*in in Pößneck</title>
  <style>
    :root {
      --blue: #164aa3;
      --blue-dark: #0e3374;
      --violet: #6d51c7;
      --ink: #172033;
      --muted: #687085;
      --line: #e6e8ee;
      --surface: #ffffff;
      --canvas: #f6f7fb;
      --shadow: 0 12px 30px rgba(23, 32, 51, .08);
      --radius: 18px;
      --container: 1080px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      line-height: 1.55;
    }
    a { color: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    .container { width: min(calc(100% - 40px), var(--container)); margin: 0 auto; }
    .skip-link {
      position: fixed; left: 12px; top: -60px; z-index: 100;
      padding: 10px 14px; border-radius: 10px; color: #fff; background: var(--blue);
      transition: top .2s ease;
    }
    .skip-link:focus { top: 12px; }

    header {
      position: sticky; top: 0; z-index: 20;
      border-bottom: 1px solid rgba(230, 232, 238, .95);
      background: rgba(255, 255, 255, .93);
      backdrop-filter: blur(10px);
    }
    .nav {
      min-height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 20px;
    }
    .brand {
      font-size: 1.18rem; font-weight: 800; letter-spacing: -.04em; text-decoration: none;
    }
    .brand span { color: var(--violet); }
    .nav-links { display: flex; align-items: center; gap: 20px; }
    .nav-links a { text-decoration: none; font-size: .92rem; color: #414a5d; font-weight: 650; }
    .nav-links a:hover { color: var(--blue); }
    .nav-instagram, .button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 42px; padding: 0 15px; border: 0; border-radius: 10px;
      color: #fff !important; background: var(--blue); text-decoration: none; font-weight: 750;
      font-size: .91rem; transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }
    .nav-instagram:hover, .button:hover { background: var(--blue-dark); transform: translateY(-1px); box-shadow: 0 7px 16px rgba(22, 74, 163, .18); }
    .menu-button {
      display: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
      background: #fff; color: var(--ink); font: inherit; font-weight: 700; cursor: pointer;
    }

    .hero { padding: 80px 0 64px; background: #fff; }
    .hero-grid { display: grid; grid-template-columns: 1.15fr .85fr; align-items: center; gap: 72px; }
    .eyebrow {
      display: inline-flex; align-items: center; min-height: 28px; padding: 0 10px; border-radius: 999px;
      color: var(--blue-dark); background: #eaf1ff; font-size: .8rem; font-weight: 800; letter-spacing: .02em;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 { max-width: 650px; margin: 14px 0 14px; font-size: clamp(2.55rem, 7vw, 5rem); line-height: .98; letter-spacing: -.075em; }
    .hero-text { max-width: 550px; color: var(--muted); font-size: 1.08rem; }
    .hero-details { display: flex; flex-wrap: wrap; gap: 10px; margin: 26px 0 30px; }
    .hero-details span { padding: 8px 11px; border: 1px solid var(--line); border-radius: 9px; color: #495267; background: #fff; font-size: .88rem; font-weight: 650; }
    .logo-card {
      overflow: hidden; aspect-ratio: 1 / 1; border-radius: 24px; background: linear-gradient(140deg, #164aa3, #7957cf);
      box-shadow: 0 18px 45px rgba(24, 56, 128, .20);
    }
    .logo-card img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .caption { margin: 10px 0 0; color: #7b8394; text-align: center; font-size: .8rem; }

    section { padding: 76px 0; }
    .section-heading { max-width: 670px; margin-bottom: 32px; }
    .section-label { margin-bottom: 7px; color: var(--violet); font-weight: 800; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; }
    h2 { margin-bottom: 10px; font-size: clamp(1.85rem, 4vw, 2.65rem); line-height: 1.1; letter-spacing: -.045em; }
    .section-heading p { margin-bottom: 0; color: var(--muted); }

    .progress-section { background: #fff; }
    .progress-card { padding: clamp(22px, 5vw, 44px); border: 1px solid var(--line); border-radius: var(--radius); background: #fff; box-shadow: var(--shadow); }
    .progress-top { display: flex; align-items: end; justify-content: space-between; gap: 25px; }
    .progress-label { color: var(--muted); font-size: .9rem; font-weight: 700; }
    .percentage { margin-top: 2px; color: var(--blue); font-size: clamp(3.2rem, 10vw, 6.2rem); line-height: .95; font-weight: 850; letter-spacing: -.08em; }
    .date-range { color: var(--muted); font-size: .9rem; text-align: right; }
    .bar { height: 14px; overflow: hidden; margin: 30px 0 27px; border-radius: 999px; background: #e9edf5; }
    .bar > div { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--violet)); transition: width .7s ease; }
    .countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .time-box { padding: 15px 10px; border: 1px solid var(--line); border-radius: 12px; background: #fafbfe; text-align: center; }
    .time-box strong { display: block; font-size: clamp(1.25rem, 3vw, 1.75rem); line-height: 1.1; letter-spacing: -.04em; }
    .time-box span { color: var(--muted); font-size: .78rem; font-weight: 700; }

    .milestones { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; margin-top: 38px; }
    .milestone { position: relative; padding: 26px 14px 0; border-top: 3px solid #dbe0e9; color: #7d8594; }
    .milestone::before { content: ""; position: absolute; top: -9px; left: 0; width: 14px; height: 14px; border: 3px solid #dbe0e9; border-radius: 50%; background: #fff; }
    .milestone strong { display: block; color: inherit; font-size: .9rem; }
    .milestone small { display: block; margin-top: 3px; color: inherit; font-size: .76rem; }
    .milestone.active { border-color: var(--blue); color: var(--blue-dark); }
    .milestone.active::before { border-color: var(--blue); background: var(--blue); }

    .info-section { background: #f0f3f9; }
    .empty-state { display: grid; place-items: center; min-height: 230px; padding: 30px; border: 1px dashed #cbd3e0; border-radius: var(--radius); background: rgba(255,255,255,.68); text-align: center; }
    .empty-face { margin-bottom: 8px; color: var(--violet); font-size: 2rem; line-height: 1; }
    .empty-state h3 { margin-bottom: 5px; font-size: 1.15rem; letter-spacing: -.02em; }
    .empty-state p { margin-bottom: 0; color: var(--muted); }

    .about-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 22px; }
    .text-card, .school-card { padding: 30px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
    .text-card p { margin-bottom: 0; color: #4e586c; font-size: 1.03rem; }
    .school-card { background: var(--blue); color: #fff; }
    .school-card p { margin-bottom: 22px; color: rgba(255,255,255,.8); }
    .school-card h3 { margin-bottom: 7px; font-size: 1.36rem; letter-spacing: -.03em; }
    .school-card .button { color: var(--blue) !important; background: #fff; }
    .school-card .button:hover { background: #f1f5ff; }

    .instagram { padding: 74px 0; color: #fff; background: #172033; }
    .instagram-grid { display: flex; align-items: center; justify-content: space-between; gap: 30px; }
    .instagram .section-label { color: #bcaeff; }
    .instagram h2 { margin-bottom: 9px; }
    .instagram p { max-width: 610px; margin-bottom: 0; color: #cbd2e1; }
    .instagram .button { flex: 0 0 auto; color: #fff !important; background: var(--violet); }
    .instagram .button:hover { background: #6045b5; }

    footer { padding: 28px 0; color: #727b8d; background: #101725; font-size: .85rem; }
    .footer-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .footer-links { display: flex; gap: 16px; }
    .footer-links a { color: #c1c8d7; text-decoration: none; }
    .footer-links a:hover { color: #fff; }

    @media (max-width: 780px) {
      .container { width: min(calc(100% - 32px), var(--container)); }
      .menu-button { display: block; }
      .nav-links {
        display: none; position: absolute; left: 16px; right: 16px; top: 62px; padding: 15px;
        flex-direction: column; align-items: stretch; gap: 4px; border: 1px solid var(--line);
        border-radius: 14px; background: #fff; box-shadow: var(--shadow);
      }
      .nav-links.open { display: flex; }
      .nav-links a { padding: 9px 8px; }
      .nav-instagram { margin-top: 4px; }
      .hero { padding: 52px 0 48px; }
      .hero-grid, .about-grid { grid-template-columns: 1fr; gap: 35px; }
      .hero-visual { width: min(82vw, 390px); margin: 0 auto; }
      section { padding: 58px 0; }
      .progress-top { display: block; }
      .date-range { margin-top: 10px; text-align: left; }
      .countdown { grid-template-columns: repeat(2, 1fr); }
      .milestones { grid-template-columns: 1fr; gap: 0; margin-left: 8px; }
      .milestone { padding: 0 0 20px 25px; border-top: 0; border-left: 3px solid #dbe0e9; }
      .milestone::before { top: 0; left: -9px; }
      .milestone.active { border-color: var(--blue); }
      .instagram-grid, .footer-row { align-items: flex-start; flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
